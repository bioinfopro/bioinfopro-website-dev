<div class="custom-banner">
    <div class="banner-content">
        <h3>{{ include.title }}</h3>
        <p>{{ include.text }}</p>
    </div>
    {% if include.link %}
    <div class="banner-action">
        <a href="{{ include.link }}" class="btn">{{ include.button_text }}</a>
    </div>
    {% endif %}
</div>
